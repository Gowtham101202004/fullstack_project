<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/Auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="/JavaScript/script.js"></script>
    <style>
        body{
            height: 100vh;
            overflow-y: auto;
        }
        .auth-details{
            margin-top: 20px;
            margin-bottom: 150px;
        }
        .auth-details .input-box input{
            width: 300px;
        }
        .auth-details .input-box label{
            margin: 10px 0 0 -310px;
        }
        #input-box-name{
            position: relative;
            justify-content: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: row;
        }
        #input-box-name input{
            width: 135px;
            padding: 10px;
            color: white;
            font-size: 16px;
            outline: none;
            background: transparent;
            border: 1px solid white;    
        }
        #input-box-name input:focus{
            box-shadow: white 0px 0px 5px;
        }
        #input-box-name label{
            position: absolute;
            margin: 10px 0 0 -145px;
            color: rgb(185, 185, 185);
            pointer-events: none;
            transition: ease 0.4s;
        }
        #input-box-name input:focus + label,
        #input-box-name input:valid + label{
            margin-top: -8px;
            color: white;
            font-size: 12px;
            text-shadow:
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
        }
        #input-box-name input:focus + label #optional,
        #input-box-name input:valid + label #optional{
            display: none;
        }
        #input-phone{
            width: 255px;
        }
        #input-phone-label{
            margin-left: -265px;
        }
        #output, #char-len, #char-case, #char-num, #char-special{
            font-size: 12px;
            font-weight: bold;
        }
        #confirmPassCheck{
            font-size: 14px;
            font-weight: bold;
        }
        #optional{
            font-size: 12px;
        }
        #toggleIcon, #toggleIcon2{
            display: none;
            transform: scale(0.90);
            position: absolute;
            margin: 12px 0 0 -30px;
            cursor: pointer;
        }
        @media screen and (max-width: 767px){
            .auth-details{
                padding: 40px 30px;
            }
            .auth-details .input-box input{
                width: 230px;
            }
            .auth-details .input-box label{
                margin: 10px 0 0 -240px;
            }
            #input-box-name input{
                width: 100px;    
            }
            #input-box-name label{
                margin: 10px 0 0 -110px;
            }
            #input-phone{
                width: 185px;
            }
            #input-phone-label{
                margin-left: -195px;
            }
            .auth-details .input-box select{
                width: 40px;
                padding: 10px 0 10px 5px;  
            }
            #optional{
                display: none;
            }
        }
    </style>
</head>
<body>
   <center>
        <div class="logo_and_name">
            <div class="logo">
                <img src="/Media/Images/Netify_Logo(White).png">
            </div>
            <h1>Netify</h1>
        </div>
        <div class="auth-details">
            <h1>SignUp</h1>
            <div id="input-box-name">
                <div>
                    <input type="text" class="name-input" id="name" oninput="nameValidation()" onblur="nameValidation2()" autocomplete="off" required>
                    <label>first name</label>
                </div>
                &nbsp;&nbsp;
                <div>
                    <input type="text" required>
                    <label>last name <span id="optional">(optional)</span></label>
                </div>
            </div>
            <div style="text-align: left;">
                <p id="nameCheck"></p>
            </div>
            <div class="input-box">
                <select>
                    <option>+91</option>
                    <option>+94</option>
                    <option>+81</option>
                    <option>+1</option>
                    <option>+61</option>
                    <option>+62</option>
                    <option>+977</option>
                </select>
                <input type="number" id="input-phone" oninput="phonenumberValidation()" onblur="phonenumberValidation2()" required>
                <label id="input-phone-label">phone number</label>
            </div>
            <div style="text-align: left;">
                <p id="phoneCheck"></p>
            </div>
            <div class="input-box">
                <input type="email" id="email"  oninput="emailValidation()" onblur="emailValidation2()" required>
                <label id="email-label">email</label>
            </div>
            <div style="text-align: left;">
                <p id="emailCheck"></p>
            </div>
            <div class="input-box">
                <input type="password" id="pass" oninput="passwordValidation()" required>
                <label>password</label>
                <i id="toggleIcon" class="fa-solid fa-eye-slash" onclick="togglePassword()"></i>
            </div>
            <div style="text-align: left;">
                <p id="output"></p>
                <p id="char-len"></p>
                <p id="char-case"></p>
                <p id="char-num"></p>
                <p id="char-special"></p>
            </div>
            <div class="input-box">
                <input type="password" id="confirm-pass" oninput="confirmPassValidation()" onblur="confirmPassValidation2()" required>
                <label>confirm password</label>
                <i id="toggleIcon2" class="fa-solid fa-eye-slash" onclick="togglePassword2()"></i>
            </div>
            <div style="text-align: left;">
                <p id="confirmPassCheck"></p>
            </div>
            <div class="last" style="text-align: left; margin-bottom: 10px;">
                <input type="checkbox">
                I read and agree the 
                    <a href="/HTML/Auth/Terms_and_Conditions.html">
                        <span>terms & Conditions</span>
                    </a>
            </div>
            <div class="auth-button">
                 <a href="/HTML/Auth/OTP.html">
                     <input type="submit" value="Next">
                 </a>
            </div>
            <div class="last">
                Already have an account?
                <a href="/HTML/Auth/Login.html">
                    <span> Login</span>
                </a>
            </div>
        </div>
    </center>
</body>
</html>
