<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Successfull</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/Auth.css">
    <style>
        .signup-success img{
            width: 150px;
            animation: float 3s ease-in-out infinite;
            box-shadow: rgba(125, 255, 86, 0.5) 0px 0px 40px;
            border-radius: 50%;
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .go-icon{
            padding: 5px;
            width: 50px;
            height: auto;
            border: 2px solid transparent;
            background-color: black;
            border-radius: 50px;
            box-shadow: black 0px 0px 10px;
            transition: ease 0.3s;
        }
        .go-icon:hover{
            box-shadow: white 0px 0px 10px;
            background-color: white;
            content: url('/Media/Images/enter_button.png');
        }
        .go-icon:active{
            transform: scale(0.9);
        }
        @media screen and (max-width: 767px){
            .auth-details{
                width: 250px;
                padding: 20px 40px;
            }
            .auth-details h2{
                font-size: 20px;
                margin: 20px 0;
            }
            .go-icon{
                width: 40px;
            }
        }
    </style>
</head>
<body>
   <center>
        <div class="logo_and_name">
            <div class="logo">
                <img src="/Media/Images/Netify_Logo(White).png">
            </div>
            <h1>Netify</h1>
        </div>
        <div class="auth-details">
            <div class="signup-success">
                <img src="/Media/Images/tik.png">
                <h2>You signed up successfully!</h2>
            </div>
            <div class="auth-button">
                <a href="/HTML/Auth/Login.html">
                     <img src="/Media/Images/enter_button2.png" class="go-icon">
                </a>
            </div>
        </div>
    </center>
</body>
</html>
