<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/Auth.css">    
    <style>
        @media screen and (max-width: 767px){
            .auth-details{
                width: 250px;
                padding: 40px;
            }
            .auth-details .input-box input{
                width: 170px;
            }
            .auth-details .input-box label{
                margin: 10px 0 0 -180px;
            }
            .auth-details h1{
                font-size: 34px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
   <center>
        <div class="logo_and_name">
            <div class="logo">
                <img src="/Media/Images/Netify_Logo(White).png">
            </div>
            <h1>Netify</h1>
        </div>
        <div class="auth-details">
            <h1>OTP Verification</h1>
            <div class="top">
                Enter the code sent to your mobile number
            </div>
            <div class="input-box">
                <input type="number" required>
                <label>OTP</label>
            </div>
            <div class="auth-button">
                <a href="/HTML/Auth/Successfull_SignUp.html">
                    <input type="submit" value="Verify">
                </a>
            </div>
            <div class="last">
                OTP not received?
                <span> Resend OTP</span>
            </div>
        </div>
    </center>
</body>
</html>
