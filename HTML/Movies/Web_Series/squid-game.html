<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <style>
        body {
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            width: 100%;
            height: 100%;
            background-image: url("/Media/Images/squid_game_background.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: blur(3px);
            z-index: -1;
        }
        h1{
            text-align: center;
        }
        .container{
            display: flex;
            flex-direction: row;
            width: 100%;
        }
        .left-container{
            margin: 60px 60px 0 190px;
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        .left-container h2{
            margin-top: 10px;
        }
        .left-container img{
            height: 320px;
            width: 550px;
            border: 2px solid white;
            box-shadow: white 0px 0px 10px;
        }
        .right-container{
            height: fit-content;
        }
        .right-container table{
            margin-top: 65px;
            border-collapse: collapse;
            font-size: 20px;
        }
        .right-container table td{
            border-color: white;
            box-shadow: white 0px 0px 8px;
            border-width: 2px;
            min-width: 150px;
            max-width: 460px;
            padding: 7px;
        }
        b{
            font-weight: bold;
        }
        .movie-container{
            margin: 50px auto;
            padding-bottom: 100px;
            display: flex;
            gap: 80px;
            flex-direction: column;
            width: fit-content;
        }
        .movie-container h1{
            margin-top: 10px;
        }
        .movie-container video{
            width: 100%;
            height: 550px;
            border-radius: 10px;
            box-shadow: white 0px 0px 8px;
        }
    </style>
</head>
<body>
    <a href="/HTML/Movies/MovieCollection.html">
        <img src="/Media/Images/back_button2.png" class="back-icon">
    </a>
    <h1>Series</h1>
    <div class="container">
        <div class="left-container">
            <div>
                <img src="/Media/Images/squid_game.jpg" class="image">
                <h2>Squid Game</h2>
            </div>
        </div>
        <div class="right-container">
            <table border>
                <tr>
                    <td><b>Genre</b></td>
                    <td>Survival, Thriller, Drama</td>
                </tr>
                <tr>
                    <td><b>Created by</b></td>
                    <td>Hwang Dong-hyuk</td>
                </tr>
                <tr>
                    <td><b>Theme music composer</b></td>
                    <td>Jung Jae-il</td>
                </tr>
                <tr>
                    <td><b>Original language</b></td>
                    <td>Korean</td>
                </tr>
                <tr>
                    <td><b>Original name</b></td>
                    <td>오징어 게임 (Ojingeo Geim)</td>
                </tr>
                <tr>
                    <td><b>No of seasons</b></td>
                    <td>2</td>
                </tr>
                <tr>
                    <td><b>No of episodes</b></td>
                    <td>16</td>
                </tr>
                <tr>
                    <td><b>Release date</b></td>
                    <td>17 September 2021</td>
                </tr>
            </table>
        </div>
    </div>
    <div class="movie-container">
        <div>
            <h1>Season 1</h1>
            <video src="/Media/Video/Series/Squid-Game/Squid Game Season 1.mp4" controls></video>
        </div>
        <div>
            <h1>Season 2</h1>
            <video src="/Media/Video/Series/Squid-Game/Squid Game Season 2.mp4" controls></video>
        </div>
    </div>
</body>
</html>
