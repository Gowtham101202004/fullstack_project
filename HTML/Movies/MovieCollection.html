<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <style>
        body {
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            width: 100%;
            height: 100%;
            background-image: url("/Media/Images/movie_background.jpeg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: blur(3px);
            z-index: -1;
        }
        .container{
            position: relative;
        }
        .scroll-container{
            margin-right: 20px;
            height: fit-content;
            padding: 0 10px;
            overflow-x: auto;
        }
        .category{
            margin: 15px 0 0 30px;
            padding: 0 15px;
            text-align: left;
            justify-self: left;
            border: 2px solid white;
            text-shadow: black 0 0 10px;
            box-shadow:  white 0 0 10px;
            border-top-left-radius: 20px;
            border-bottom-right-radius: 20px;
            width: fit-content;
            background-color: rgba(52, 52, 52, 0.3);
        }
        .scroll-container img{
            height: 155px;
            width: 250px;
            transition: ease 0.1s;
            border: 2px solid white;
            transition: ease 0.2s;
        }
        .scroll-container img:hover{
            box-shadow: white 0px 0px 10px;
            cursor: pointer;
        }
        .scroll-row {
            display: flex;
            gap: 5px;
            padding: 10px;
        }
        .details {
            padding: 0 10px;
            flex: 0 0 auto;
            text-align: center;
        }
        h2{
            margin: 10px 0;
        }
        hr{
            margin: 0 10px;
            border: 2px solid white;
            box-shadow: white 0px 0px 10px;
        }
    </style>
</head>
<body>
    <a href="/index.html">
        <img src="/Media/Images/back_button2.png" class="back-icon">
    </a>
    <h1 style="text-shadow: black 0 0 10px; font-size: 35px; text-align: center;">Movies</h1>
    <div class="container">
        <h1 class="category">Series</h1>
        <div class="scroll-container">
            <div class="scroll-row">
                <div class="details">
                    <a href="/HTML/Movies/Web_Series/moneyheist.html">
                        <img src="/Media/Images/moneyheist.jpg">
                    </a>
                    <h2>Money Heist</h2>
                </div>
                <div class="details">
                     <a href="/HTML/Movies/Web_Series/got.html">
                        <img src="/Media/Images/got.jpg">
                    </a>
                    <h2>Game of Thrones</h2>
                </div>
                <div class="details">
                     <a href="/HTML/Movies/Web_Series/stranger-things.html">
                        <img src="/Media/Images/stranger-things.jpg">
                    </a>
                    <h2>Stranger Things</h2>
                </div>
                <div class="details">
                     <a href="/HTML/Movies/Web_Series/squid-game.html">
                        <img src="/Media/Images/squid_game.jpg">
                    </a>
                    <h2>Squid Game</h2>
                </div>
                <div class="details">
                     <a href="/HTML/Movies/Web_Series/the-boys.html">
                        <img src="/Media/Images/the-boys.jpg">
                    </a>
                    <h2>The Boys</h2>
                </div>
            </div>
        </div>
        <hr>
    </div>
</body>
</html>
