<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending Now</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <style>
        body {
            position: relative;
            height: fit-content;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            width: 100%;
            height: 100%;
            background-image: url("/Media/Images/trending_background.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: blur(3px);
            z-index: -1;
        }
        h1{
            text-align: center;
        }
        .container{
            display: flex;
            flex-direction: row;
            width: 100%;
        }
        .left-container{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 60px 60px 60px 130px;
        }
        .left-container img{
            height: 330px;
            width: 550px;
            border: 2px solid white;
            box-shadow: white 0px 0px 10px;
        }
        .left-container audio{
            margin-top: 15px;
            width: 570px;
            height: 40px;
        }
        .right-container{
            height: fit-content;
        }
        .right-container table{
            margin-top: 85px;
            border-collapse: collapse;
            font-size: 20px;
        }
        .right-container table td{
            border-color: white;
            box-shadow: white 0px 0px 8px;
            border-width: 2px;
            min-width: 150px;
            padding: 10px;
        }
        b{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <a href="/HTML/Songs/SongCollection.html">
        <img src="/Media/Images/back_button2.png" class="back-icon">
    </a>
    <h1>Trending Now</h1>
    <div class="container">
        <div class="left-container">
            <div>
                <img src="/Media/Images/kanimaa.jpg">
            </div>
            <div>
                <audio src="/Media/Audio/Trending_Songs/Kanimaa.mp3" controls></audio>
            </div>
        </div>
        <div class="right-container">
            <table border>
            <tr>
                <td><b>Genre</b></td>
                <td>kuthu, dance, pop, EDM, folk music</td>
            </tr>
            <tr>
                <td><b>Movie</b></td>
                <td>Retro</td>
            </tr>
            <tr>
                <td><b>Composer(s)</b></td>
                <td>Santhosh Narayanan</td>
            </tr>
            <tr>
                <td><b>Lyricist(s)</b></td>
                <td>Vivek</td>
            </tr>
            <tr>
                <td><b>Singer(s)</b></td>
                <td>Santhosh Narayanan</td>
            </tr>
            <tr>
                <td><b>Released</b></td>
                <td>21 March 2025</td>
            </tr>
        </table>
        </div>
    </div>
</body>
</html>
