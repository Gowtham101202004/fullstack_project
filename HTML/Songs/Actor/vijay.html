<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actor</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <style>
        body {
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            width: 100%;
            height: 100%;
            background-image: url("/Media/Images/vijay.jpg");
            background-size: cover;
            background-attachment: fixed;
            filter: blur(3px);
            z-index: -1;
        }
        h1{
            text-align: center;
        }
        .container{
            display: flex;
            margin: 60px;
        }
        b{
            font-weight: bold;
        }
        span{
            color: rgb(0, 255, 229);
            font-weight: bold;
        }
        .details h1{
            text-align: left;
            margin: 0 0 0 20px;
        }
        .details p{
            margin: 15px 0 0 20px;
            font-size: 18px;
            text-align: justify;
            text-shadow: black 0px 0px 10px;
            line-height: 1.4;
        }
        .image{
            height: 225px;
            width: 350px;
            border: 2px solid white;
            box-shadow: white 0px 0px 10px;
        }
        audio{
            height: 40px;
            width: 400px;
            padding: 10px;
        }
        .table-container{
            margin-top: 70px;
            padding-bottom: 100px;
            display: flex;
            justify-content: center;
        }
        .table-container img{
            height: 150px;
            width: 130px;
            border: 1px solid white;
            box-shadow: white 0px 0px 5px;
        }
        table{
            border-collapse: collapse;
            align-self: center;
        }
        table th{
            font-size: 25px;
            border: 1px solid white;
            box-shadow: white 0px 0px 8px;
            text-shadow: white 0px 0px 3px;
            width: 200px;
            padding: 10px;
        }
        table td{
            border: 1px solid white;
            box-shadow: white 0px 0px 8px;
            width: 200px;
            padding: 10px;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <a href="/HTML/Songs/SongCollection.html">
        <img src="/Media/Images/back_button2.png" class="back-icon">
    </a>
    <h1>Actor</h1>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Year</th>
                    <th>Movie</th>
                    <th>Singer(s)</th>
                    <th>Song name</th>
                    <th>Song</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>2021</td>
                    <td><img src="/Media/Images/master.jpg"><br>Master</td>
                    <td>Vijay</td>
                    <td>Kutti Story</td>
                    <td><audio src="/Media/Audio/Actor/Vijay/Kutti-Story-MassTamilan.io.mp3" controls></audio></td>
                </tr>
                <tr>
                    <td>2014</td>
                    <td><img src="/Media/Images/kaththi.jpg"><br>Kaththi</td>
                    <td>Vijay,<br>Sunidhi Chauhan</td>
                    <td>Selfie Pulla</td>
                    <td><audio src="/Media/Audio/Actor/Vijay/Selfie-Pulla.mp3" controls></audio></td>
                </tr>
                <tr>
                    <td>2022</td>
                    <td><img src="/Media/Images/beast.jpg"><br>Beast</td>
                    <td>Anirudh Ravichander,<br>Jonita Gandhi</td>
                    <td>Arabic Kuthu</td>
                    <td><audio src="/Media/Audio/Actor/Vijay/Arabic-Kuthu---Halamithi-Habibo-MassTamilan.so.mp3" controls></audio></td>
                </tr>
                <tr>
                    <td>2023</td>
                    <td><img src="/Media/Images/leo.jpg"><br>Leo</td>
                    <td>Vijay,<br>Asal Kolaar</td>
                    <td>Naa Ready</td>
                    <td><audio src="/Media/Audio/Actor/Vijay/Naa-Ready-MassTamilan.dev.mp3" controls></audio></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
